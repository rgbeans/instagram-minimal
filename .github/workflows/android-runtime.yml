name: Android runtime verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-runtime.yml'
      - 'ci/**'
      - 'scripts/**'
      - 'extensions/**'
      - 'patches/**'

permissions:
  contents: read

concurrency:
  group: android-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.13'
      - name: Prepare Android and patching tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          bash scripts/bootstrap-tools.sh
          echo "KOTLIN_HOME=$GITHUB_WORKSPACE/.toolchain/kotlinc" >> "$GITHUB_ENV"
      - name: Create isolated CI signing key
        shell: bash
        run: |
          mkdir -p signing
          python3 - <<'PY'
          import pathlib, secrets
          p = pathlib.Path('signing/password.txt')
          p.write_text(secrets.token_urlsafe(32))
          p.chmod(0o600)
          PY
          keytool -genkeypair -keystore signing/instagram-minimal.p12 -storetype PKCS12 -alias minimal -keyalg RSA -keysize 3072 -validity 30 -dname 'CN=Instagram Minimal CI Test' -storepass:file signing/password.txt
      - name: Obtain verified stock Instagram and build
        shell: bash
        run: |
          mkdir -p build/input
          curl --fail --location --retry 3 --max-time 300 -o build/input/instagram.xapk 'https://d.apkpure.net/b/XAPK/com.instagram.android?versionCode=386014758&nc=arm64-v8a&sv=28'
          bash build.sh build/input/instagram.xapk
          bash scripts/test-apk.sh
          python3 ci/compare-dex.py
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android guard and full-app startup tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on
          script: |
            bash scripts/run-android-tests.sh
            bash ci/verify-runtime.sh
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-runtime-evidence
          path: |
            build/runtime/
            build/android-tests/result.txt
            build/patch-report.json
            build/input-receipt.json
          if-no-files-found: warn
          retention-days: 7
