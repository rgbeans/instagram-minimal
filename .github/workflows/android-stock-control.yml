name: Android stock control
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-stock-control.yml', 'diagnostics/run-stock-control.sh']
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21.0.13'
      - name: Prepare SDK and verified stock input
        shell: bash
        run: |
          # This is an ephemeral hosted runner; retain Java and remove unused SDK/tool caches.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools" build/input build/stock-control
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/android-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          echo "7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  $RUNNER_TEMP/android-tools.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          chmod +x "$ANDROID_HOME/cmdline-tools/latest/bin/"*
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'build-tools;36.0.0'
          curl --fail --location --retry 3 --max-time 300 -o build/input/instagram.xapk 'https://d.apkpure.net/b/XAPK/com.instagram.android?versionCode=386014758&nc=arm64-v8a&sv=28'
          python3 scripts/verify-input.py build/input/instagram.xapk "$ANDROID_HOME/build-tools/36.0.0" build/stock-control/input-receipt.json
          python3 - <<'PY'
          import pathlib, zipfile
          dest = pathlib.Path('build/stock-control')
          with zipfile.ZipFile('build/input/instagram.xapk') as z:
              for name in z.namelist():
                  if name.endswith('.apk'):
                      (dest/pathlib.PurePosixPath(name).name).write_bytes(z.read(name))
          assert list(dest.glob('*.apk'))
          PY
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run unchanged stock application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 3072M
          disk-size: 3072M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on
          pre-emulator-launch-script: bash ci/free-emulator-space.sh
          script: bash diagnostics/run-stock-control.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-stock-control-evidence
          path: |
            build/stock-control/*.txt
            build/stock-control/*.json
            build/stock-control/*.xml
            build/stock-control/*.png
          if-no-files-found: warn
          retention-days: 7
